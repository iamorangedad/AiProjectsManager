<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas Diagram Tool</title>
  <style>
    body { min-width: 240px; padding: 14px; font-family: system-ui, sans-serif; margin: 0; }
    h3 { margin: 0 0 10px; font-size: 14px; color: #1a202c; }
    p { margin: 0 0 12px; font-size: 12px; color: #718096; line-height: 1.4; }
    .btn { width: 100%; padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer; background: #3182ce; color: #fff; border: none; border-radius: 8px; }
    .btn:hover { background: #2b6cb0; }
    .hint { margin-top: 8px; font-size: 10px; color: #a0aec0; text-align: center; }
  </style>
</head>
<body>
  <h3>Canvas Diagram Tool</h3>
  <p>Manage AI projects on a visual canvas with persistent storage.</p>
  <button id="openCanvas" class="btn">Open Canvas</button>
  <div class="hint">Opens in a new tab</div>
  <script type="module" src="popup.js"></script>
</body>
</html>
